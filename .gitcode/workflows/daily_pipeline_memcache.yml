name: daily_pipeline_memcache

on:
  schedule:
    - cron: "0 23 * * *"

env:
  AK_ASCEND: ${{ secrets.AK_ASCEND }}
  SK_ASCEND: ${{ secrets.SK_ASCEND }}
  AK_MIRRORS: ${{ secrets.AK_MIRRORS }}
  SK_MIRRORS: ${{ secrets.SK_MIRRORS }}
  ASCEND_DEVCLOUD_PYPI_MANAGEMENT_URL: ${{ vars.ASCEND_DEVCLOUD_PYPI_MANAGEMENT_URL }}
  ASCEND_DEVCLOUD_PYPI_USERNAME: ${{ secrets.ASCEND_DEVCLOUD_PYPI_USERNAME }}
  ASCEND_DEVCLOUD_PYPI_PASSWORD: ${{ secrets.ASCEND_DEVCLOUD_PYPI_PASSWORD }}

stages:
  stage_1:
    name: Build
    jobs:
      Build_memcache_arm:
        name: Build_memcache_arm
        runs-on: [self-hosted, default, arm, cpu=32]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/memfabric-hybrid/memfabric-hybrid_arm:memfabric_version_v5
        steps:
          - name: Prepare source
            uses: checkout
            with:
              ref: ${{ atomgit.ref }}
              submodules: recursive

          - name: Build and package
            run: |
              set -ex

              # Create the build output directory
              mkdir -p ${WORKSPACE}/BeiMing_output

              # Build wheels for Python 3.10 through 3.13
              python_multi_versions=("cp310-cp310" "cp311-cp311" "cp312-cp312" "cp313-cp313")

              for item_version in "${python_multi_versions[@]}"; do
                (
                  # Set the Python environment for this build
                  export PYTHON_HOME=/opt/python/${item_version}
                  export PATH=/opt/python/${item_version}/bin:/usr/bin:$PATH

                  # Upgrade the build toolchain
                  pip3 install --upgrade pip
                  pip3 install --upgrade setuptools wheel
                  pip3 install pybind11==3.0.1   # Pin the version for ABI compatibility
                  pip3 install auditwheel --force-reinstall

                  # Verify the Python environment
                  python3 --version
                  which pip3

                  # Run the build script
                  cd ${WORKSPACE}/
                  bash script/build_and_pack_run.sh --build_python_whl_type daily

                  # Collect all wheels in the output directory
                  find output/ -name "*.whl" | xargs -i cp -rf {} ${WORKSPACE}/BeiMing_output/
                )
              done

          - name: Archive packages
            run: |
              set -ex

              # Install and configure obsutil
              mkdir /usr/local/obsutil
              wget --no-verbose https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_arm64.tar.gz
              tar -zxvf obsutil_linux_arm64.tar.gz -C /usr/local/obsutil/
              ln -sf "$(ls -d /usr/local/obsutil/obsutil_linux_arm64_* | sort -V | tail -n1)/obsutil" /usr/local/bin/obsutil

              # Configure OBS credentials
              obsutil config -i=${AK_ASCEND} -k=${SK_ASCEND} -e=obs.cn-southwest-2.myhuaweicloud.com

              # Upload build artifacts to OBS
              obsutil cp -r -f ${WORKSPACE}/BeiMing_output \
                obs://ascend-ci-artifacts-staging/pypi/packages/ascend/repos/pypi/nightly/memcache-hybrid/ -flat

              obsutil config -i=${AK_MIRRORS} -k=${SK_MIRRORS} -e=obs.cn-north-4.myhuaweicloud.com
              obsutil cp -r -f ${WORKSPACE}/BeiMing_output \
                obs://ascend-artifcat-packages/pypi/packages/ascend/repos/pypi/nightly/memcache-hybrid/ -flat

          - name: Sync wheels to Ascend PyPI
            run: |
              /opt/python/cp310-cp310/bin/python3 "${WORKSPACE}/.gitcode/workflows/scripts/sync_pypi.py" \
                --component memcache-hybrid \
                --version "$(tr -d '[:space:]' < "${WORKSPACE}/VERSION")" \
                --nightly --apply

      Build_memcache_x86:
        name: Build_memcache_x86
        runs-on: [self-hosted, default, x86, cpu=32]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/memfabric-hybrid/memfabric-hybrid_x86:memfabric_version_v5
        steps:
          - name: Prepare source
            uses: checkout
            with:
              ref: ${{ atomgit.ref }}
              submodules: recursive

          - name: Build and package
            run: |
              set -ex

              # Create the build output directory
              mkdir -p ${WORKSPACE}/BeiMing_output

              # Build wheels for Python 3.10 through 3.13
              python_multi_versions=("cp310-cp310" "cp311-cp311" "cp312-cp312" "cp313-cp313")

              for item_version in "${python_multi_versions[@]}"; do
                (
                  # Set the Python environment for this build
                  export PYTHON_HOME=/opt/python/${item_version}
                  export PATH=/opt/python/${item_version}/bin:/usr/bin:$PATH

                  # Upgrade the build toolchain
                  pip3 install --upgrade pip
                  pip3 install --upgrade setuptools wheel
                  pip3 install pybind11==3.0.1   # Pin the version for ABI compatibility
                  pip3 install auditwheel --force-reinstall

                  # Verify the Python environment
                  python3 --version
                  which pip3

                  # Run the build script
                  cd ${WORKSPACE}/
                  bash script/build_and_pack_run.sh --build_python_whl_type daily

                  # Collect all wheels in the output directory
                  find output/ -name "*.whl" | xargs -i cp -rf {} ${WORKSPACE}/BeiMing_output/
                )
              done

          - name: Archive packages
            run: |
              set -ex

              # Install and configure obsutil
              mkdir /usr/local/obsutil
              wget --no-verbose https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz
              tar -zxvf obsutil_linux_amd64.tar.gz -C /usr/local/obsutil/
              ln -sf "$(ls -d /usr/local/obsutil/obsutil_linux_amd64_* | sort -V | tail -n1)/obsutil" /usr/local/bin/obsutil

              # Configure OBS credentials
              obsutil config -i=${AK_ASCEND} -k=${SK_ASCEND} -e=obs.cn-southwest-2.myhuaweicloud.com

              # Upload build artifacts to OBS
              obsutil cp -r -f ${WORKSPACE}/BeiMing_output \
                obs://ascend-ci-artifacts-staging/pypi/packages/ascend/repos/pypi/nightly/memcache-hybrid/ -flat

              obsutil config -i=${AK_MIRRORS} -k=${SK_MIRRORS} -e=obs.cn-north-4.myhuaweicloud.com
              obsutil cp -r -f ${WORKSPACE}/BeiMing_output \
                obs://ascend-artifcat-packages/pypi/packages/ascend/repos/pypi/nightly/memcache-hybrid/ -flat

          - name: Sync wheels to Ascend PyPI
            run: |
              /opt/python/cp310-cp310/bin/python3 "${WORKSPACE}/.gitcode/workflows/scripts/sync_pypi.py" \
                --component memcache-hybrid \
                --version "$(tr -d '[:space:]' < "${WORKSPACE}/VERSION")" \
                --nightly --apply
